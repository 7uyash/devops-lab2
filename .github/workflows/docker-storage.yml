name: Docker Storage

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/docker-storage.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  RUN: 'run(){ echo "$ $*"; eval "$@"; echo; }'

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Container-layer data is lost on deletion
        run: |
          eval "$RUN"
          docker pull -q alpine:3.20 >/dev/null
          run docker run -d --name c1 alpine:3.20 sleep 600
          run "docker exec c1 sh -c 'echo \"Hello from container layer\" > /data.txt'"
          run docker exec c1 cat /data.txt
          run docker diff c1
          run docker rm -f c1
          run docker run -d --name c2 alpine:3.20 sleep 600
          run "docker exec c2 cat /data.txt || echo '=> data.txt is gone: it lived only in the deleted container layer'"
          run docker rm -f c2

      - name: 2. Named volume keeps data
        run: |
          eval "$RUN"
          run docker volume create appdata
          run docker volume ls
          run docker run -d --name v1 -v appdata:/data alpine:3.20 sleep 600
          run "docker exec v1 sh -c 'echo \"Saved in named volume at \$(date -u +%H:%M:%S)\" > /data/notes.txt'"
          run docker exec v1 cat /data/notes.txt
          run docker rm -f v1
          run "docker run --rm --name v2 -v appdata:/data alpine:3.20 cat /data/notes.txt"
          run "docker volume inspect appdata --format 'Name={{.Name}}  Driver={{.Driver}}  Mountpoint={{.Mountpoint}}'"
          run sudo ls -l /var/lib/docker/volumes/appdata/_data

      - name: 3. Bind mount shares a host folder
        run: |
          eval "$RUN"
          run mkdir -p ~/host-data
          run docker run -d --name b1 -v ~/host-data:/data alpine:3.20 sleep 600
          run "docker exec b1 sh -c 'echo \"Written inside container b1\" > /data/from-container.txt'"
          run docker rm -f b1
          run ls -l ~/host-data
          run cat ~/host-data/from-container.txt
          run "echo 'Written on the host' > ~/host-data/from-host.txt"
          run "docker run --rm -v ~/host-data:/data alpine:3.20 sh -c 'ls -l /data && cat /data/from-host.txt'"

      - name: 4. Clean up
        run: |
          eval "$RUN"
          run docker volume rm appdata
          run docker volume ls
