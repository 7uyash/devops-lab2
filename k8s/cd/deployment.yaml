apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-cd
  labels:
    app: lab2-cd
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lab2-cd
  template:
    metadata:
      labels:
        app: lab2-cd
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: lab2-app
          image: lab2-app
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
